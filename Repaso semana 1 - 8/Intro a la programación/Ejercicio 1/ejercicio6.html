<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificar numero</title>
</head>
<body>
    <h1>Indicar si es positivo, negativo o cero</h1>
    <button onclick="verificarNumero()">Ingresar numero</button>
    <p id="resultado"></p>

    <script>
        function verificarNumero() {
            let numero = document.getElementById('resultado')
            switch (numero) {
                case numero > 0:
                    document.getElementById('resultado').innerHTML = `${numero} es positivo`

            }
        }
    </script>
</body>
</html>
