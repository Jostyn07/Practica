<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numero del 1 al 20</title>
</head>
<body>
    <h1>Imprime los números del 1 al 20 usando un bucle</h1>
    <button id="bucle" onclick="generarBucle()">Generar bucle</button>
    <div id="mostrarBucle"></div>
    <script>

        function generarBucle() {
            for (let i = 1; i <= 20; i++){
                const parrafo = document.createElement("p")
                parrafo.textContent = i
                document.getElementById('mostrarBucle').appendChild(parrafo)
            }

        }
    </script>
</body>
</html>
