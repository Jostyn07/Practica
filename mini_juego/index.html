<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" placeholder="Ingresa un valor" id="numero">
    <button id="Enviar">Enviar</button>
    <script>

        document.getElementById("Enviar").addEventListener("click", function() {
            let numero=document.getElementById("numero")
            ingresarNumero()

            function ingresarNumero() {
                if (numero.value < 5 ) return "pequeño"
                if (numero.value > 4 && numero < 9) return "Mediano"
                if (numero.value >= 10) return "Grande"
            }

            function mostrar() {
                alert(ingresarNumero())
            }
            mostrar()
            numero.value = ""
        })

    </script>
</body>
</html>
